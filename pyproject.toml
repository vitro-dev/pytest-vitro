[build-system]
    build-backend = "setuptools.build_meta"
    requires = ["setuptools", "setuptools-scm"]

[tool.setuptools_scm]
    version_scheme = "no-guess-dev"
    # Fail on dirty trees and strip local version — recommended for release CI
    # TODO: move to no-local-version-strict once released
    local_scheme = "no-local-version"


[project]
    authors = [
        { name = "Filippo Carra", email = "karrukola@users.noreply.github.com" },
    ]
    description = "A pytest plugin to leverage the Vitro framework for test automation."
    name = "pytest-vitro"
    readme = "README.md"

    classifiers = [
        "Intended Audience :: Developers",
        "Intended Audience :: Information Technology",
        "Intended Audience :: Telecommunications Industry",
        "License :: OSI Approved :: BSD License",
        "Programming Language :: Python :: 3",
        "Topic :: Software Development :: Embedded Systems",
        "Topic :: Software Development :: Quality Assurance",
        "Topic :: Software Development :: Testing :: Acceptance",
        "Topic :: Software Development :: Testing",
    ]
    dynamic = ['version']
    requires-python = ">=3.10"

    dependencies = ["pytest-html>=4.2.0", "pytest>=8", "vitro>=0.8.0"]


[project.urls]
    Homepage = "https://github.com/vitro-dev/pytest-vitro"
    Issues = "https://github.com/vitro-dev/pytest-vitro/issues"
    Repository = "https://github.com/vitro-dev/pytest-vitro"
    source = "https://github.com/vitro-dev/pytest-vitro"

[project.entry-points."pytest11"]
    pytest_vitro = "pytest_vitro.pytest_plugin"

[dependency-groups]
    ci = [
        "darglint2>=1.8.2",
        "mypy>=1.19.1",
        "nox>=2026.2.9",
        "pre-commit-uv>=4.2.0",
        "pre-commit>=4.5.1",
        "pylint>=4.0.4",
        "ruff>=0.15.0",
    ]
    dev = [
        { include-group = "ci" },
        { include-group = "doc" },
        { include-group = "test" },
    ]
    doc = ["sphinx>=8.1.3"]
    test = ["covdefaults>=2.3.0", "coverage>=7.14.0", "pytest-mock>=3.15.1"]


[tool.ruff]
    line-length = 88
    target-version = "py310" # as per README

[tool.ruff.format]
    docstring-code-format = true
    preview = true

[tool.ruff.lint]
    fixable = ["ALL"]
    ignore = [
        "COM812", # conflict with autoformatter
        "D203",   # conflict with autoformatter,
        "D213",   # conflict with autoformatter
        "FIX002", # TODOs are not blockers
        "ISC001", # conflict with autoformatter
        "T201",   # allow usage of print
        # ignore for now
        "FIX001", # used as a placeholder for further work
        "SLF001", # accessing protected members
        "TD",     # one-man shop here
    ]
    select = ["ALL"]
    unfixable = [
        "F401", # we must know why we are not using the imported module
    ]

[tool.ruff.lint.per-file-ignores]
    "tests/*" = [
        "ANN201", # all tests return None
        "S101",   # pytest works with assert
        # ignore for now
        "PLR2004", # usage of magic numbers
    ]


# Ensure that we use the public Python Package Index.
[[tool.uv.index]]
    default = true
    url = "https://pypi.org/simple"


[tool.coverage.run]
    parallel = true
    plugins = ["covdefaults"]

[tool.coverage.report]
    fail_under = 43
